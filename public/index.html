<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APK QA Platform - Production Quality Testing & Analysis Suite</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-logo"><i class="fa-solid fa-bug"></i></div>
      <div class="brand-text">
        <h2>APK QA Suite</h2>
        <span>Production Platform</span>
      </div>
    </div>

    <nav class="nav-links">
      <a href="#" class="nav-tab active" data-view="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="#" class="nav-tab" data-view="findings"><i class="fa-solid fa-triangle-exclamation"></i> Findings</a>
      <a href="#" class="nav-tab" data-view="version-compare"><i class="fa-solid fa-code-compare"></i> Compare</a>
      <a href="#" class="nav-tab" data-view="reports"><i class="fa-solid fa-file-contract"></i> Reports</a>
      <a href="#" class="nav-tab" data-view="audit-logs"><i class="fa-solid fa-clock-rotate-left"></i> Audit Log</a>
    </nav>

    <div style="display: flex; align-items: center; gap: 14px;">
      <!-- Requirement #1: Prominent + New QA Test Header Button -->
      <button class="btn btn-primary" onclick="switchView('wizard')" style="box-shadow: 0 0 16px var(--primary-glow); font-weight: 700;">
        <i class="fa-solid fa-plus"></i> New QA Test
      </button>

      <span class="badge badge-low" style="text-transform: none;"><i class="fa-solid fa-circle"></i> Server: 8080</span>
      <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700;">
        QA
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="container" id="viewContainer">
    <!-- Rendered dynamically by app.js -->
  </main>

  <script src="/js/api/client.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
